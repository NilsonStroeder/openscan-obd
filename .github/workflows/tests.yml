name: Tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run browser interaction tests
        run: python -m unittest discover -s tests/browser -v
