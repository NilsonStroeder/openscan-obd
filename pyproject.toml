[project]
name = "openscan-obd"
version = "0.1.0"
description = "Scanner automotivo geral e extensível com OBD-II, UDS/KWP e transporte J2534"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nilson Stroeder Filho" }]
keywords = ["obd2", "j2534", "kwp2000", "uds", "diagnostic", "can"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openscan_obd = ["static/*.html"]
